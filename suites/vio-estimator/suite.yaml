# A TEVV test suite (tevv.suite.v2), an example to copy: a list of tests (tests/<id>.yaml),
# run in order, each as written (its scenario, which stack flies each drone, how many runs).
schema: tevv.suite.v2
name: VIO estimator suite
description: 'How well a stereo-inertial estimator tracks the vehicle: accuracy on an easy path, robustness to fast
  motion, and drift over distance. TEVV flies every path; the stack''s estimator rides along and publishes its estimate.'
tests:
- test: vio-baseline-box
  purpose: Baseline accuracy on an easy box at 1.5 m/s
- test: vio-aggressive-zigzag
  purpose: Robustness to fast motion and sharp turns at 3 m/s
- test: vio-long-loop
  purpose: Drift, heading and scale over three climbing laps (about 140 m)
