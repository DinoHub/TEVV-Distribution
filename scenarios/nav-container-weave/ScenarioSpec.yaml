schema: mns.scenario.v1
id: nav-container-weave
name: "Planner: weaving between containers (the stack flies)"
stack_name: nav-container-weave

# Purpose: clearance and smoothness in clutter. Four goals that weave through
# the H-shaped container block and past a container bar 5 m off the line
# between goals: the planner must keep its distance and fly smoothly. Judged
# on reaching every goal, contact, clearance to what it sensed and jerk; time
# to goal is reported.
#
# Authored in ScenarioLab: the world, the drone and its mission. Who flies it
# is chosen at run time (a suite's --stack, or your test), not the scenario's.

environment:
  # XFS as packs/v1.0.0.lock.json pins it (same as vio-osmo-xfs-ardupilot).
  id: xfs-level
  version: 1.0.2
  artifact_digest: sha256:7eeb41a5ad04d3d2f4bd8c5d876703793b7485d93d59d07172d12c174c100871

runtime:
  features:
    sim_real_eval: false
    ros2_bridge: true
    qgroundcontrol: false
    # The planner's setpoints reach ArduPilot through the bridge's MAVROS
    # (/Drone1/mavros/setpoint_raw/local), and the pilot arms and takes off
    # through it.
    mavros: true

vehicles:
- id: drone_1
  name: Drone1
  runtime_name: Drone1
  ros_domain_id: 1
  # The container yard, 2.3 m above the measured ground (NED z -18.70):
  # see vio-osmo-xfs-ardupilot for how it was measured.
  start:
    x: 423
    y: -906
    z: -21.0
  # One forward camera, for the live view only.
  cameras:
    front:
      position:
        x: 0.15
        y: 0
        z: -0.25
      capture_settings:
      - image_type: 0
        width: 640
        height: 480
        fov_degrees: 80
  sensors:
    imu: true
    gps: true
    barometer: true
    magnetometer: true
    gpu_lidar: true

missions:
- id: test
  drone: Drone1
  type: waypoints
  points:
  - [13.925, -24.785, 3.0]
  - [-2.185, -18.999, 3.0]
  - [5.3, -17.007, 3.0]
  - [27.658, -0.059, 3.466]
  timeout_s: 180
  reach_radius_m: 1.0
  observers:
  - id: no-crash
    type: collisions
    check: {max: 0}
  - id: goals
    type: goals_reached
    check: {min: 1.0}
  - id: clearance
    type: cloud_clearance
    check: {min: 0.5}
  - id: jerk
    type: jerk
    check: {max: 50}
  - {id: to-goal, type: time_to_goal}
