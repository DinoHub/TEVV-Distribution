# Sim-time lockstep with a stereo pair (ADR 0004, steps 1-2): vio-osmo-xfs-ardupilot's
# world, vehicle, IMU and stereo rig (640x480, FOV 80, 0.12 m baseline -- the rig the
# OpenVINS calibration-campaign-v1 was frozen on), with both cameras on the pinhole SHM
# path through the fisheye render arbiter: a 10 Hz sim-time grid and fisheye_lockstep.
# 10 Hz, not 30: OpenVINS keeps 11 clones, so at 30 Hz its window spans 0.37 s and the
# scale goes (lockstep runs 6.5 m and 18.8 m ATE, scale 0.51 and 0.18), while ~10 Hz
# (1.1 s) is the regime calibration-campaign-v1 was tuned in (free run 0.64 m).
# No estimator here; OpenVINS attaches as a component (components/openvins-stereo-lockstep).
# No exposure_compensation: on the pinhole SHM path it switches auto exposure off, and
# vio-osmo's -11 EV (meant for the RPC camera) leaves the image black (max pixel 10).
# Compose only (SHM needs ipc: host).
schema: mns.scenario.v1
id: stereo-lockstep-xfs
name: XFS, ArduPilot, stereo pair on SHM under sim-time lockstep
stack_name: stereo-lockstep-xfs
environment:
  id: xfs-level
  version: 1.0.2
  artifact_digest: sha256:7eeb41a5ad04d3d2f4bd8c5d876703793b7485d93d59d07172d12c174c100871
runtime:
  profile: airsim_unreal_ardupilot_docker
  features:
    sim_real_eval: true
    ros2_bridge: true
    qgroundcontrol: false
    foxglove_bridge: false
    mavros: true
vehicles:
- id: drone_1
  name: Drone1
  runtime_name: Drone1
  ros_domain_id: 1
  # The campaign flies its route as an ArduPilot mission (mission.fly_as:
  # ardupilot_mission): mode switch high is AUTO, arming and takeoff in AUTO need
  # no throttle, and the mission's CONDITION_YAW holds between waypoints. Set at
  # boot: the bridge's MAVROS runs without its parameter plugin.
  autopilot_params:
    ardupilot: {FLTMODE6: 3, AUTO_OPTIONS: 3, WP_YAW_BEHAVIOR: 0}
  start:
    x: 423
    y: -906
    z: -21.0
  cameras:
    front:
      position:
        x: 0.15
        y: 0
        z: -0.25
      capture_settings:
      - image_type: 0
        width: 640
        height: 480
        fov_degrees: 80
        pinhole_shm_publish_enabled: true
        fisheye_sync_capture_fps: 10
        fisheye_lockstep: true
    front_right:
      position:
        x: 0.15
        y: 0.12
        z: -0.25
      capture_settings:
      - image_type: 0
        width: 640
        height: 480
        fov_degrees: 80
        pinhole_shm_publish_enabled: true
        fisheye_sync_capture_fps: 10
        fisheye_lockstep: true
  sensors:
    imu:
      generate_noise: true
      angular_random_walk: 0.5833
      velocity_random_walk: 0.2039
      gyro_bias_stability: 0.0
      accel_bias_stability: 0.0
    gps: true
    barometer: true
    magnetometer: true
    gpu_lidar: false
conditions:
  render:
    # Draw the main viewport, small: under NoDisplay a Lumen pinhole capture leaks
    # (the renderer's per-frame distance-field bookkeeping only runs for a drawn view).
    draw_viewport: true
    viewport_resolution: [320, 240]
    system_settings:
      r.Fisheye.MaxReadbacksInFlight: 3
