schema: mns.scenario.v1
id: nav-detour
name: "Planner: one goal behind a container row (the stack flies)"
stack_name: nav-detour

# Purpose: avoiding an obstacle in the way. One goal 39 m south-west, behind
# a 30 m row of containers that blocks the straight line: the planner has to
# find a way round. Judged on reaching the goal, contact and clearance to
# what it sensed; path length is reported.
#
# Authored in ScenarioLab: the world, the drone and its mission. Who flies it
# is the test's choice (tests/nav-detour.yaml), not the scenario's.

environment:
  # XFS as packs/v1.0.0.lock.json pins it (same as vio-osmo-xfs-ardupilot).
  id: xfs-level
  version: 1.0.2
  artifact_digest: sha256:7eeb41a5ad04d3d2f4bd8c5d876703793b7485d93d59d07172d12c174c100871

runtime:
  features:
    sim_real_eval: false
    ros2_bridge: true
    qgroundcontrol: false
    # The planner's setpoints reach ArduPilot through the bridge's MAVROS
    # (/Drone1/mavros/setpoint_raw/local), and the pilot arms and takes off
    # through it.
    mavros: true

vehicles:
- id: drone_1
  name: Drone1
  runtime_name: Drone1
  ros_domain_id: 1
  # The container yard, 2.3 m above the measured ground (NED z -18.70):
  # see vio-osmo-xfs-ardupilot for how it was measured.
  start:
    x: 423
    y: -906
    z: -21.0
  # One forward camera, for the live view only.
  cameras:
    front:
      position:
        x: 0.15
        y: 0
        z: -0.25
      capture_settings:
      - image_type: 0
        width: 640
        height: 480
        fov_degrees: 80
  sensors:
    imu: true
    gps: true
    barometer: true
    magnetometer: true
    gpu_lidar: true

missions:
- id: test
  drone: Drone1
  type: waypoints
  points:
  - [-30, -25, 3]
  timeout_s: 180
  reach_radius_m: 1.0
  observers:
  - id: no-crash
    type: collisions
    check: {max: 0}
  - id: goals
    type: goals_reached
    check: {min: 1.0}
  - id: clearance
    type: cloud_clearance
    check: {min: 0.3}
  - {id: path, type: path_length}
  - {id: to-goal, type: time_to_goal}
